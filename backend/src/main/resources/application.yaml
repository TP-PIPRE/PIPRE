spring:

  application:
    name: PipreBackend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/pipre_database}
    username: ${POSTGRES_USER:pipre_user}
    password: ${POSTGRES_PASSWORD:pipre_password}
    hikari:
      connection-timeout: 3000
      initialization-fail-timeout: 3000

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    placeholders:
      telemetry_fk_validation: NOT VALID
  threads:
    virtual:
      enabled: true
springdoc:
  api-docs:
    enabled: true

scalar:
  enabled: true
  path: /scalar

jwt:
  secret: ${JWT_SECRET:clave_secreta_segura_desarrollo_muy_larga_para_pipre}

pipre:
  security:
    cookie-secure: ${PIPRE_COOKIE_SECURE:false}
    cookie-same-site: ${PIPRE_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${PIPRE_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
