spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
jwt:
  secret: ${JWT_SECRET}
pipre:
  seed:
    access-users: false
    demo-data: false
  security:
    cookie-secure: true
    cookie-same-site: ${PIPRE_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${PIPRE_ALLOWED_ORIGINS}
